<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><style>.bg{fill:#fbfbfa}.box{fill:#fff;stroke:#d8d8d2;stroke-width:2}.accent{fill:#171717}.green{fill:#edf3ec;stroke:#93b294;stroke-width:2}.warn{fill:#fff8e7;stroke:#dfc276;stroke-width:2}.text{font-family:Arial,sans-serif;fill:#2f3437}.muted{font-family:Arial,sans-serif;fill:#787774}.title{font:bold 34px Arial}.h{font:bold 20px Arial}.p{font:16px Arial}.small{font:14px Arial}.arrow{stroke:#171717;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#171717"/></marker></defs>
<rect width="1400" height="760" class="bg"/><text x="70" y="70" class="text title">Flow 3 — Employé / tablette kiosque</text><text x="70" y="105" class="muted p">La tablette reste à l’accueil et fonctionne sans compte visiteur</text>
<rect x="70" y="190" width="270" height="190" rx="16" class="box"/><text x="110" y="235" class="text h">1. Préparer la tablette</text><text x="110" y="275" class="text p">Ouvrir le lien QR avec Internet</text><text x="110" y="305" class="muted small">Formulaire + logo + motifs mis en cache</text><text x="110" y="335" class="muted small">Ajouter à l’écran d’accueil</text>
<path d="M340 285 H415" class="arrow"/>
<rect x="415" y="190" width="270" height="190" rx="16" class="green"/><text x="455" y="235" class="text h">2. Accueillir</text><text x="455" y="275" class="text p">L’employé laisse le kiosque ouvert</text><text x="455" y="305" class="muted small">Aucun login nécessaire</text><text x="455" y="335" class="muted small">Le visiteur prend la tablette</text>
<path d="M685 285 H760" class="arrow"/>
<rect x="760" y="190" width="270" height="190" rx="16" class="box"/><text x="800" y="235" class="text h">3. Faire remplir</text><text x="800" y="275" class="text p">Champs + motif + signature</text><text x="800" y="305" class="muted small">Validation par le visiteur</text><text x="800" y="335" class="muted small">Pas de données précédentes visibles</text>
<path d="M1030 285 H1105" class="arrow"/>
<rect x="1105" y="190" width="230" height="190" rx="16" class="accent"/><text x="1140" y="235" fill="white" class="h">4. Enregistrer</text><text x="1140" y="275" fill="white" class="p">Écriture IndexedDB</text><text x="1140" y="305" fill="#d8d8d2" class="small">Instantanée, même offline</text><text x="1140" y="335" fill="#d8d8d2" class="small">Clé anti-doublon</text>
<path d="M1220 380 V470" class="arrow"/>
<rect x="960" y="470" width="375" height="170" rx="16" class="warn"/><text x="1000" y="515" class="text h">5. Réseau disponible ?</text><text x="1000" y="555" class="text p">Oui → synchronisation silencieuse</text><text x="1000" y="585" class="muted small">Non → file locale conservée</text>
<path d="M960 555 H880" class="arrow"/>
<rect x="600" y="470" width="280" height="170" rx="16" class="green"/><text x="640" y="515" class="text h">6. Fin de session</text><text x="640" y="555" class="text p">Téléphone : fermeture</text><text x="640" y="585" class="muted small">Tablette : reset formulaire</text>
<path d="M600 555 H520" class="arrow"/>
<rect x="250" y="470" width="270" height="170" rx="16" class="box"/><text x="290" y="515" class="text h">7. Visiteur suivant</text><text x="290" y="555" class="text p">Formulaire vierge affiché</text><text x="290" y="585" class="muted small">L’employé ne manipule pas les données</text>
<text x="70" y="705" class="muted p">Le patron consulte les entrées synchronisées depuis son dashboard ; l’employé utilise uniquement l’interface kiosque.</text></svg>
