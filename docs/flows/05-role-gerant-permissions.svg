<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><style>.bg{fill:#fbfbfa}.box{fill:#fff;stroke:#d8d8d2;stroke-width:2}.ok{fill:#edf3ec;stroke:#93b294;stroke-width:2}.no{fill:#fdebec;stroke:#d49b9b;stroke-width:2}.dark{fill:#171717}.text{font-family:Arial,sans-serif;fill:#2f3437}.muted{font-family:Arial,sans-serif;fill:#787774}.title{font:bold 34px Arial}.h{font:bold 20px Arial}.p{font:16px Arial}.s{font:14px Arial}.arrow{stroke:#171717;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#171717"/></marker></defs><rect width="1500" height="850" class="bg"/><text x="70" y="65" class="text title">Rôle 2 — Gérant</text><text x="70" y="100" class="muted p">Gestion opérationnelle quotidienne, sans contrôle de sécurité critique</text><rect x="70" y="160" width="250" height="150" rx="16" class="box"/><text x="105" y="205" class="h text">1. Invitation</text><text x="105" y="245" class="p text">Email puis Google OAuth</text><text x="105" y="273" class="s muted">Rattachement automatique</text><path d="M320 235H395" class="arrow"/><rect x="395" y="160" width="260" height="150" rx="16" class="ok"/><text x="430" y="205" class="h text">2. Accès métier</text><text x="430" y="245" class="p text">Registre et formulaire</text><text x="430" y="273" class="s muted">Motifs et signatures visibles</text><path d="M655 235H730" class="arrow"/><rect x="730" y="160" width="260" height="150" rx="16" class="box"/><text x="765" y="205" class="h text">3. Exploiter</text><text x="765" y="245" class="p text">Exporter CSV</text><text x="765" y="273" class="s muted">Afficher et télécharger le QR</text><path d="M990 235H1065" class="arrow"/><rect x="1065" y="160" width="280" height="150" rx="16" class="dark"/><text x="1105" y="205" fill="white" class="h">4. Passer au staff</text><text x="1105" y="245" fill="white" class="p">Inviter des agents staff</text><text x="1105" y="273" fill="#d8d8d2" class="s">Pas de nouveau gérant</text><text x="70" y="390" class="h text">Permissions autorisées</text><rect x="70" y="425" width="390" height="275" rx="16" class="ok"/><text x="105" y="470" class="p text">✓ Consulter le registre</text><text x="105" y="510" class="p text">✓ Exporter le registre CSV</text><text x="105" y="550" class="p text">✓ Gérer plusieurs formulaires</text><text x="105" y="590" class="p text">✓ Gérer les QR par point d’accueil</text><text x="105" y="630" class="p text">✓ Gérer motifs, points et tablettes</text><text x="105" y="670" class="p text">✓ Utiliser le mode Staff</text><rect x="540" y="425" width="390" height="275" rx="16" class="no"/><text x="580" y="470" class="h text">Restrictions</text><text x="580" y="515" class="p text">✕ Régénérer le QR</text><text x="580" y="555" class="s muted">Réservé au Patron</text><text x="580" y="600" class="p text">✕ Renommer l’établissement</text><text x="580" y="640" class="s muted">Réservé au Patron</text><text x="580" y="680" class="p text">✕ Supprimer formulaire ou point</text><rect x="1010" y="425" width="400" height="275" rx="16" class="box"/><text x="1050" y="470" class="h text">Sortie du flow</text><text x="1050" y="515" class="p text">Dashboard opérateur</text><text x="1050" y="555" class="s muted">Le gérant maintient l’accueil</text><text x="1050" y="610" class="p text">Escalade au Patron</text><text x="1050" y="650" class="s muted">Pour QR, nom ou droits sensibles</text><text x="70" y="790" class="muted p">Le Gérant peut faire fonctionner l’établissement mais ne modifie pas son identité ni ses contrôles critiques.</text></svg>
