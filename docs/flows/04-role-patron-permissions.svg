<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><style>.bg{fill:#fbfbfa}.box{fill:#fff;stroke:#d8d8d2;stroke-width:2}.ok{fill:#edf3ec;stroke:#93b294;stroke-width:2}.dark{fill:#171717}.text{font-family:Arial,sans-serif;fill:#2f3437}.muted{font-family:Arial,sans-serif;fill:#787774}.title{font:bold 34px Arial}.h{font:bold 20px Arial}.p{font:16px Arial}.s{font:14px Arial}.arrow{stroke:#171717;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#171717"/></marker></defs><rect width="1500" height="850" class="bg"/><text x="70" y="65" class="text title">Rôle 1 — Patron / responsable</text><text x="70" y="100" class="muted p">Contrôle complet de l’établissement, du registre et de l’équipe</text><rect x="70" y="160" width="230" height="150" rx="16" class="box"/><text x="105" y="205" class="h text">1. Connexion</text><text x="105" y="245" class="p text">Google OAuth</text><text x="105" y="273" class="s muted">Création ou accès à l’espace</text><path d="M300 235H370" class="arrow"/><rect x="370" y="160" width="250" height="150" rx="16" class="ok"/><text x="405" y="205" class="h text">2. Configurer</text><text x="405" y="245" class="p text">Nom, logo, motifs</text><text x="405" y="273" class="s muted">Formulaire + signature</text><path d="M620 235H690" class="arrow"/><rect x="690" y="160" width="250" height="150" rx="16" class="box"/><text x="725" y="205" class="h text">3. Publier</text><text x="725" y="245" class="p text">QR personnalisé</text><text x="725" y="273" class="s muted">Installer la tablette</text><path d="M940 235H1010" class="arrow"/><rect x="1010" y="160" width="330" height="150" rx="16" class="dark"/><text x="1050" y="205" class="h" fill="white">4. Piloter</text><text x="1050" y="245" class="p" fill="white">Registre + signatures</text><text x="1050" y="273" class="s" fill="#d8d8d2">Export CSV et suivi</text><text x="70" y="390" class="h text">Permissions autorisées</text><rect x="70" y="425" width="390" height="275" rx="16" class="ok"/><text x="105" y="470" class="p text">✓ Consulter le registre</text><text x="105" y="510" class="p text">✓ Exporter le registre CSV</text><text x="105" y="550" class="p text">✓ Gérer plusieurs formulaires</text><text x="105" y="590" class="p text">✓ Gérer les QR par point d’accueil</text><text x="105" y="630" class="p text">✓ Régénérer le QR</text><text x="105" y="670" class="p text">✓ Gérer les points et tablettes</text><rect x="540" y="425" width="430" height="275" rx="16" class="box"/><text x="580" y="470" class="h text">Actions sensibles</text><text x="580" y="515" class="p text">Renommer l’établissement</text><text x="580" y="550" class="s muted">Logo, motifs, formulaires et appareils</text><text x="580" y="595" class="p text">Régénérer le QR</text><text x="580" y="630" class="s muted">L’ancien lien est invalidé</text><text x="580" y="675" class="p text">Inviter gérant ou staff</text><rect x="1050" y="425" width="360" height="275" rx="16" class="dark"/><text x="1090" y="470" fill="white" class="h">Sortie du flow</text><text x="1090" y="515" fill="white" class="p">Dashboard administrateur</text><text x="1090" y="555" fill="#d8d8d2" class="s">Gestion globale de l’entreprise</text><text x="1090" y="600" fill="white" class="p">Décisions et sécurité</text><text x="1090" y="640" fill="#d8d8d2" class="s">Le patron reste responsable</text><text x="70" y="790" class="muted p">Le Patron est le seul rôle qui peut renommer l’établissement, régénérer le QR et inviter des membres.</text></svg>
