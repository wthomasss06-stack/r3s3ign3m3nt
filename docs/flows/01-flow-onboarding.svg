<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><style>.bg{fill:#fbfbfa}.box{fill:#fff;stroke:#d8d8d2;stroke-width:2}.accent{fill:#171717}.green{fill:#edf3ec;stroke:#93b294;stroke-width:2}.text{font-family:Arial,sans-serif;fill:#2f3437}.muted{font-family:Arial,sans-serif;fill:#787774}.title{font:bold 34px Arial}.h{font:bold 20px Arial}.p{font:16px Arial}.small{font:14px Arial}.arrow{stroke:#171717;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#171717"/></marker></defs>
<rect width="1400" height="760" class="bg"/><text x="70" y="70" class="text title">Flow 1 — Onboarding patron / utilisateur invité</text><text x="70" y="105" class="muted p">Création de l’espace, rattachement à l’entreprise et configuration de l’accueil</text>
<rect x="70" y="165" width="250" height="160" rx="16" class="box"/><circle cx="110" cy="205" r="25" class="accent"/><text x="110" y="212" text-anchor="middle" fill="white" font-weight="bold">1</text><text x="150" y="205" class="text h">Authentification</text><text x="100" y="250" class="text p">Connexion Google</text><text x="100" y="278" class="muted small">Profil et avatar récupérés</text>
<path d="M320 245 H385" class="arrow"/>
<rect x="385" y="165" width="270" height="160" rx="16" class="green"/><circle cx="425" cy="205" r="25" class="accent"/><text x="425" y="212" text-anchor="middle" fill="white" font-weight="bold">2</text><text x="465" y="205" class="text h">Vérification invitation</text><text x="415" y="250" class="text p">Email invité dans une entreprise ?</text><text x="415" y="278" class="muted small">Oui → rôle et établissement liés</text><text x="415" y="300" class="muted small">Non → création d’un espace patron</text>
<path d="M655 245 H720" class="arrow"/>
<rect x="720" y="165" width="250" height="160" rx="16" class="box"/><circle cx="760" cy="205" r="25" class="accent"/><text x="760" y="212" text-anchor="middle" fill="white" font-weight="bold">3</text><text x="800" y="205" class="text h">Profil & rôle</text><text x="750" y="250" class="text p">Avatar + rôle détecté</text><text x="750" y="278" class="muted small">Patron, gérant ou staff</text>
<path d="M970 245 H1035" class="arrow"/>
<rect x="1035" y="165" width="295" height="160" rx="16" class="box"/><circle cx="1075" cy="205" r="25" class="accent"/><text x="1075" y="212" text-anchor="middle" fill="white" font-weight="bold">4</text><text x="1115" y="205" class="text h">Établissement</text><text x="1065" y="250" class="text p">Nom + logo sur PC/mobile</text><text x="1065" y="278" class="muted small">Motifs de visite actualisables</text>
<path d="M1180 325 V405" class="arrow"/>
<rect x="1035" y="405" width="295" height="160" rx="16" class="box"/><text x="1065" y="450" class="text h">Formulaire visiteur</text><text x="1065" y="490" class="text p">Champs, motif « Autre »</text><text x="1065" y="518" class="muted small">Signature enregistrée en SVG</text>
<path d="M1035 485 H970" class="arrow"/>
<rect x="720" y="405" width="250" height="160" rx="16" class="green"/><text x="750" y="450" class="text h">QR + invitation</text><text x="750" y="490" class="text p">Logo centré dans le QR</text><text x="750" y="518" class="muted small">Inviter maintenant ou passer</text>
<path d="M720 485 H655" class="arrow"/>
<rect x="385" y="405" width="270" height="160" rx="16" class="accent"/><text x="415" y="450" fill="white" class="h">Dashboard prêt</text><text x="415" y="490" fill="white" class="p">Registre, équipe, QR</text><text x="415" y="518" fill="#d8d8d2" class="small">Signature visible dans les visites</text>
<text x="70" y="680" class="muted p">Sortie : l’utilisateur arrive dans son espace selon son rôle et l’établissement est correctement identifié.</text></svg>
